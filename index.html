<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 工具箱 · 随时随处可用</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📄</text></svg>">
<style>
:root{--bg:#f5f6f8;--card:#fff;--pri:#2563eb;--txt:#1f2937;--muted:#6b7280;--line:#e5e7eb;--ok:#059669;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
header{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;padding:28px 16px;text-align:center}
header h1{font-size:22px;margin-bottom:6px}
header p{font-size:13px;opacity:.85}
.badge{display:inline-block;background:rgba(255,255,255,.15);border-radius:99px;padding:3px 12px;font-size:12px;margin-top:10px}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;transition:.15s;user-select:none}
.tool:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08);border-color:var(--pri)}
.tool .ico{font-size:30px}
.tool h3{font-size:15px;margin:8px 0 4px}
.tool p{font-size:12px;color:var(--muted)}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.panel.active{display:block}
.panel h2{font-size:17px;margin-bottom:4px}
.panel .desc{font-size:13px;color:var(--muted);margin-bottom:14px}
.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.drop.on{border-color:var(--pri);background:#eff6ff}
.filelist{margin:12px 0;font-size:13px}
.filelist .f{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#f8fafc;border-radius:8px;margin-bottom:6px}
.filelist .f .rm{color:#dc2626;cursor:pointer;padding:0 6px}
input[type=text],select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
.row{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;align-items:center}
.row label{font-size:13px;color:var(--muted);white-space:nowrap}
button.go{width:100%;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;cursor:pointer;margin-top:10px}
button.go:disabled{opacity:.5}
button.back{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:10px}
.status{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
.status.ok{color:var(--ok)}
.status.err{color:#dc2626}
a.dl{display:inline-block;background:var(--ok);color:#fff;border-radius:10px;padding:10px 18px;margin-top:10px;text-decoration:none;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <h1>📄 PDF 工具箱</h1>
  <p>合并 · 拆分 · 旋转 · 删页 · 图片互转 · 压缩</p>
  <span class="badge">🔒 全程本地处理，文件不上传任何服务器</span>
</header>
<main>
  <div id="menu" class="grid"></div>

  <div id="panel" class="panel">
    <button class="back" onclick="backToMenu()">← 返回工具列表</button>
    <h2 id="pTitle"></h2>
    <div class="desc" id="pDesc"></div>
    <div id="pBody"></div>
    <div class="status" id="pStatus"></div>
    <div id="pOut"></div>
  </div>
</main>
<footer>托管于 GitHub Pages · 纯前端实现 · 数据永不离开你的设备</footer>

<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script>
const TOOLS = [
  {id:'merge', ico:'🗂️', name:'合并 PDF', desc:'选择多个 PDF，按顺序合并为一个文件'},
  {id:'split', ico:'✂️', name:'拆分 PDF', desc:'按页码区间拆分导出（如 1-3,5,8-10）'},
  {id:'rotate',ico:'🔄', name:'旋转页面', desc:'旋转所有页面（90/180/270°）'},
  {id:'delpg', ico:'🗑️', name:'删除页面', desc:'删除指定页码后导出（如 2,5-7）'},
  {id:'img2pdf',ico:'🖼️', name:'图片转 PDF', desc:'JPG/PNG 多张图片合成一个 PDF'},
  {id:'pdf2img',ico:'📸', name:'PDF 转图片', desc:'把 PDF 每页导出为 PNG 图片'},
  {id:'compress',ico:'🗜️', name:'压缩 PDF', desc:'页面转图片重编码（可选质量，牺牲文字可复制性）'},
];
const menu = document.getElementById('menu');
menu.innerHTML = TOOLS.map(t=>`<div class="tool" onclick="openTool('${t.id}')"><div class="ico">${t.ico}</div><h3>${t.name}</h3><p>${t.desc}</p></div>`).join('');

let curTool=null, files=[];
const $=id=>document.getElementById(id);
function setStatus(msg,cls){const s=$('pStatus');s.textContent=msg||'';s.className='status '+(cls||'');}
function backToMenu(){$('panel').classList.remove('active');$('menu').style.display='grid';curTool=null;files=[];}
function openTool(id){
  curTool=TOOLS.find(t=>t.id===id); files=[];
  $('menu').style.display='none';
  $('panel').classList.add('active');
  $('pTitle').textContent=curTool.ico+' '+curTool.name;
  $('pDesc').textContent=curTool.desc;
  $('pStatus').textContent=''; $('pOut').innerHTML='';
  const accept = (id==='img2pdf') ? 'image/jpeg,image/png' : 'application/pdf';
  const multi = (id!=='img2pdf') ? 'multiple' : 'multiple';
  $('pBody').innerHTML = `
    <div class="drop" id="drop">点击或拖拽文件到这里（${id==='img2pdf'?'JPG / PNG':'PDF'}）</div>
    <div class="filelist" id="flist"></div>
    <div id="opts"></div>
    <button class="go" id="go" disabled>开始处理</button>`;
  const drop=$('drop');
  drop.onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept=accept;
    inp.onchange=()=>addFiles(inp.files);inp.click();};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('on');};
  drop.ondragleave=()=>drop.classList.remove('on');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');addFiles(e.dataTransfer.files);};
  $('go').onclick=run;
  renderOpts();
}
function renderOpts(){
  const o=$('opts'); const id=curTool.id;
  if(id==='rotate') o.innerHTML=`<div class="row"><label>旋转角度</label><select id="oAngle"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div>`;
  else if(id==='delpg') o.innerHTML=`<div class="row"><label>删除页码</label><input type="text" id="oPages" placeholder="如 2,5-7（从 1 开始）"></div>`;
  else if(id==='split') o.innerHTML=`<div class="row"><label>保留/导出页码</label><input type="text" id="oPages" placeholder="如 1-3,5,8-10；留空=每页单独一个文件"></div>`;
  else if(id==='compress') o.innerHTML=`<div class="row"><label>图片质量</label><select id="oQ"><option value="0.8">高（80%）</option><option value="0.6" selected>中（60%，推荐）</option><option value="0.4">低（40%，体积最小）</option></select><label>缩放</label><select id="oS"><option value="1">原始尺寸</option><option value="1.5" selected>1.5×DPI</option><option value="2">2×DPI</option></select></div>`;
  else if(id==='pdf2img') o.innerHTML=`<div class="row"><label>缩放</label><select id="oS"><option value="1.5" selected>1.5×（推荐）</option><option value="2">2×（更清晰）</option><option value="3">3×（最清晰）</option></select></div>`;
  else o.innerHTML='';
}
function addFiles(list){
  for(const f of list){
    const okType = curTool.id==='img2pdf' ? /image\/(jpeg|png)/.test(f.type) : (f.type==='application/pdf' || /\.pdf$/i.test(f.name));
    if(okType) files.push(f);
  }
  $('flist').innerHTML = files.map((f,i)=>`<div class="f"><span>${i+1}. ${f.name}（${(f.size/1048576).toFixed(2)} MB）</span><span class="rm" onclick="files.splice(${i},1);renderList()">✕</span></div>`).join('');
  $('go').disabled = files.length===0;
  setStatus(files.length? `已选 ${files.length} 个文件`:'');
}
function renderList(){addFiles([])}
function parsePages(str,total){
  if(!str||!str.trim()) return null; // null=全部
  const out=new Set();
  for(const part of str.split(/[,，]/)){
    const m=part.trim().match(/^(\d+)(?:-(\d+))?$/);
    if(!m) throw new Error('页码格式不对：'+part);
    let a=+m[1], b=m[2]?+m[2]:a;
    for(let p=Math.min(a,b);p<=Math.max(a,b);p++){ if(p>=1&&p<=total) out.add(p); }
  }
  return [...out].sort((x,y)=>x-y);
}
async function readPdf(file){ const bytes=await file.arrayBuffer(); return PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true}); }
async function run(){
  const go=$('go'); go.disabled=true; setStatus('处理中，请稍候…');
  try{
    let out=[];
    const id=curTool.id;
    if(id==='merge'){
      if(files.length<2) throw new Error('请至少选择 2 个 PDF');
      const dst=await PDFLib.PDFDocument.create();
      for(const f of files){ const src=await readPdf(f); const pages=await dst.copyPages(src,src.getPageIndices()); pages.forEach(p=>dst.addPage(p)); }
      out=[[files.length+'个PDF合并.pdf', await dst.save()]];
    } else if(id==='split'){
      const src=await readPdf(files[0]); const total=src.getPageCount();
      const pages=parsePages(($('oPages')||{}).value,total);
      if(!pages){ // 每页单独
        for(let i=0;i<total;i++){
          const dst=await PDFLib.PDFDocument.create();
          const [p]=await dst.copyPages(src,[i]); dst.addPage(p);
          out.push([`第${i+1}页.pdf`, await dst.save()]);
        }
      } else {
        const dst=await PDFLib.PDFDocument.create();
        const cp=await dst.copyPages(src,pages.map(p=>p-1)); cp.forEach(p=>dst.addPage(p));
        out=[['拆分结果.pdf', await dst.save()]];
      }
    } else if(id==='rotate'){
      const src=await readPdf(files[0]); const ang=+$('oAngle').value;
      src.getPages().forEach(p=>p.setRotation(PDFLib.degrees((p.getRotation().angle+ang)%360)));
      out=[['旋转后.pdf', await src.save()]];
    } else if(id==='delpg'){
      const src=await readPdf(files[0]); const total=src.getPageCount();
      const del=new Set(parsePages($('oPages').value,total)||[]);
      if(!del.size) throw new Error('请填写要删除的页码');
      const dst=await PDFLib.PDFDocument.create();
      const keep=[]; for(let i=1;i<=total;i++) if(!del.has(i)) keep.push(i-1);
      const cp=await dst.copyPages(src,keep); cp.forEach(p=>dst.addPage(p));
      out=[['删除后.pdf', await dst.save()]];
    } else if(id==='img2pdf'){
      const dst=await PDFLib.PDFDocument.create();
      for(const f of files){
        const bytes=await f.arrayBuffer();
        const img = f.type==='image/png' ? await dst.embedPng(bytes) : await dst.embedJpg(bytes);
        const page=dst.addPage([img.width,img.height]); page.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
      }
      out=[['图片合成.pdf', await dst.save()]];
    } else if(id==='pdf2img'){
      pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
      const bytes=await files[0].arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
      const s=+$('oS').value; let n=0;
      for(let i=1;i<=pdf.numPages;i++){
        setStatus(`导出第 ${i}/${pdf.numPages} 页…`);
        const page=await pdf.getPage(i);
        const vp=page.getViewport({scale:s});
        const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
        await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        const url=cv.toDataURL('image/png');
        triggerDownload(url,`${files[0].name.replace(/\.pdf$/i,'')}-第${i}页.png`);
        n++;
      }
      setStatus(`✅ 已导出 ${n} 张图片（浏览器可能拦截批量下载，请允许）`,'ok'); go.disabled=false; return;
    } else if(id==='compress'){
      pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
      const bytes=await files[0].arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
      const dst=await PDFLib.PDFDocument.create();
      const q=+$('oQ').value, s=+$('oS').value;
      for(let i=1;i<=pdf.numPages;i++){
        setStatus(`压缩第 ${i}/${pdf.numPages} 页…`);
        const page=await pdf.getPage(i);
        const vp=page.getViewport({scale:s});
        const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
        await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        const jpg=await PDFLib.PDFDocument.create();
        const img=await dst.embedJpg(cv.toDataURL('image/jpeg',q));
        const p=dst.addPage([img.width,img.height]); p.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
      }
      out=[['压缩后.pdf', await dst.save()]];
    }
    for(const [name,data] of out){
      const url=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));
      triggerDownload(url,name);
    }
    setStatus(`✅ 完成，共 ${out.length} 个文件已开始下载`,'ok');
  }catch(err){ console.error(err); setStatus('❌ '+(err.message||'处理失败'),'err'); }
  go.disabled=false;
}
function triggerDownload(url,name){ const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),30000); }
</script>
</body>
</html>
